# DukaNest Scan for iOS. Codemagic signs with the linked App Store Connect key
# and uploads the build to TestFlight.
#
# Before the first build:
# 1. In App Store Connect, create an app with bundle ID com.dukanest.proximityScanTester.
# 2. The App Store Connect API key name below must match Codemagic
#    Team integrations → Developer Portal.
# 3. Add a Codemagic variable group named app_store with:
#    APP_STORE_APPLE_ID — numeric Apple ID from App Information
#    CERTIFICATE_PRIVATE_KEY — the RSA private key, marked secret
workflows:
  dukanest-scan-ios:
    name: DukaNest Scan iOS
    working_directory: scan-tester
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "STOREFLOW MICROSYSTEMS LIMITED"
    environment:
      groups:
        - app_store
      vars:
        BUNDLE_ID: com.dukanest.proximityScanTester
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - scan-tester/**
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
      - name: Get Flutter packages
        script: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Run tests
        script: flutter test
      - name: Build iOS app
        script: |
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "Add APP_STORE_APPLE_ID to the Codemagic app_store variable group."
            exit 1
          fi
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tr -dc '0-9' || true)
          if [ -z "$LATEST" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LATEST + 1))
          fi
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          IPA_PATH=$(find "$CM_BUILD_DIR" -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced. TestFlight upload would be skipped."
            find "$CM_BUILD_DIR" -type d -name ipa || true
            exit 1
          fi
          echo "IPA ready at $IPA_PATH"
    artifacts:
      # Paths are from the repo root. IPA is under scan-tester because of working_directory.
      - scan-tester/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/scan-tester/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
